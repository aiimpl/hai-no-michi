<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hai no Michi — the Ash Road</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23d0703f%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #f3eee6; --dim: rgba(243, 238, 230, .55); --faint: rgba(243, 238, 230, .32); --ember: #d0703f; --glass: rgba(18, 18, 17, .42); }
  html, body { margin: 0; height: 100%; background: #0b0c0c; overflow: hidden; }
  /* Canvas fixed at 1350x1080 (5:4). Scaled to fit the window, letterboxed in black */
  #stage { position: absolute; left: 50%; top: 50%; width: 1350px; height: 1080px; transform-origin: 50% 50%; overflow: hidden; }
  #c { width: 100%; height: 100%; display: block; }
  #hud { position: absolute; inset: 0; pointer-events: none; color: var(--ink); font: 500 11px/1.2 Inter, system-ui, sans-serif; letter-spacing: .22em;
         text-shadow: 0 1px 8px rgba(0, 0, 0, .35); transition: opacity .6s; }
  #hud.hide { opacity: 0; }
  /* Recording: keep only the place name from the on-screen text */
  #hud.cine .tl, #hud.cine .tc, #hud.cine .tr, #hud.cine .tr2, #hud.cine .keys, #hud.cine .br, #hud.cine .spd { display: none; }
  #hud.cine .bl { bottom: 34px; left: 34px; }
  #hud .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--ember); margin-right: 11px; vertical-align: 2px; box-shadow: 0 0 8px var(--ember); }
  .tl { position: absolute; left: 22px; top: 26px; display: flex; align-items: center; gap: 14px; }
  .tl .logo { width: 17px; height: 17px; border-radius: 50%; background: linear-gradient(180deg, #f2e6d8 0 48%, var(--ember) 48% 100%); box-shadow: 0 0 0 1px rgba(255,255,255,.25); }
  .tl b { font-weight: 600; font-size: 12px; letter-spacing: .34em; }
  .tl i { font-style: normal; color: var(--faint); font-size: 10px; letter-spacing: .3em; margin-left: 10px; }
  .tc { position: absolute; left: 50%; top: 21px; transform: translateX(-50%); text-align: center; }
  .wx { font-size: 10.5px; letter-spacing: .3em; font-weight: 600; }
  .wx .sl { color: var(--faint); margin: 0 14px; }
  .compass { margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 22px; color: var(--faint); font-size: 10px; }
  .compass .tick { width: 3px; height: 3px; border-radius: 50%; background: var(--faint); }
  .compass b { color: var(--ink); font-weight: 500; font-size: 12px; letter-spacing: .12em; min-width: 46px; }
  .tr { position: absolute; right: 22px; top: 18px; display: flex; gap: 9px; pointer-events: auto; }
  .tr2 { position: absolute; right: 22px; top: 70px; display: flex; flex-direction: column; gap: 7px; pointer-events: auto; }
  #hud button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); background: var(--glass); backdrop-filter: blur(6px);
                display: grid; place-items: center; padding: 0; cursor: pointer; color: var(--ink); }
  #hud button.sq { width: 30px; height: 26px; border-radius: 6px; }
  #hud button.on { background: rgba(208, 112, 63, .92); border-color: rgba(255, 190, 150, .6); }
  #hud button svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.6; fill: none; }
  #hud button svg .fill { fill: currentColor; stroke: none; }
  #hud button.sq svg { width: 14px; height: 14px; }
  .bl { position: absolute; left: 22px; bottom: 0; }
  .ex { font-size: 9.5px; letter-spacing: .32em; font-weight: 600; color: var(--dim); margin-bottom: 12px; }
  .zone { opacity: 0; }
  .zn { font: 500 33px/1.05 'Cormorant Garamond', Georgia, serif; letter-spacing: 0; }
  .zs { margin-top: 9px; font-size: 11px; letter-spacing: .02em; color: var(--dim); font-weight: 400; }
  .spd { margin-top: 26px; display: flex; align-items: baseline; gap: 8px; height: 40px; }
  .spd b { font: 500 40px/1 'Cormorant Garamond', Georgia, serif; letter-spacing: 0; min-width: 44px; }
  .spd i { font-style: normal; font-size: 8.5px; color: var(--dim); letter-spacing: .2em; }
  .spd .st { margin-left: 42px; font-size: 9.5px; letter-spacing: .28em; color: var(--dim); font-weight: 600; }
  .keys { position: absolute; left: 50%; bottom: 14px; transform: translateX(-43%); display: flex; gap: 20px; white-space: nowrap; font-size: 10px; letter-spacing: .08em; color: var(--dim); }
  .keys .k { display: flex; align-items: center; gap: 4px; }
  .keys em { font-style: normal; margin-left: 4px; }
  kbd { display: inline-grid; place-items: center; min-width: 15px; height: 15px; padding: 0 3px; border: 1px solid rgba(255,255,255,.3); border-radius: 3px;
        font: 600 8.5px/1 Inter, sans-serif; color: var(--ink); letter-spacing: 0; background: rgba(0,0,0,.18); }
  .br { position: absolute; right: 22px; bottom: 16px; font-size: 9.5px; letter-spacing: .3em; color: var(--dim); font-weight: 600; }
  .br kbd { margin-left: 8px; }
  /* Phones: the canvas fills the screen; the HUD keeps only the place name, speed and the top-right buttons */
  html.full #stage { left: 0; top: 0; width: 100vw; height: 100dvh; transform: none !important; }
  html.full #hud { font-size: 9px; }
  html.full .keys, html.full .br, html.full .tr2, html.full .compass, html.full .tl i, html.full .spd .st { display: none; }
  html.full .tc { top: calc(env(safe-area-inset-top) + 12px); }
  html.full .tl { top: calc(env(safe-area-inset-top) + 14px); left: 16px; }
  html.full .tr { top: calc(env(safe-area-inset-top) + 8px); right: 12px; }
  html.full #hud .tr button:nth-child(n+2) { display: none; }
  html.full .bl { left: 16px; bottom: calc(env(safe-area-inset-bottom) + 6px); }
  html.full .zn { font-size: 24px; } html.full .zs { font-size: 10px; } html.full .spd { margin-top: 12px; }
  html.full .wx { font-size: 9px; letter-spacing: .22em; }
  @media (orientation: portrait) { html.full .tc { display: none; } }
  /* Touch controls */
  .touch { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .touch .pad { position: absolute; width: 0; height: 0; opacity: 0; transition: opacity .15s; }
  .touch .pad.on { opacity: 1; }
  .touch .ring { position: absolute; width: 124px; height: 124px; left: -62px; top: -62px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.35); background: rgba(0,0,0,.15); }
  .touch .knob { position: absolute; left: 0; top: 0; width: 52px; height: 52px; border-radius: 50%; background: rgba(243,238,230,.85); transform: translate(-50%, -50%); }
  .touch .btns { position: absolute; right: calc(env(safe-area-inset-right) + 14px); bottom: calc(env(safe-area-inset-bottom) + 18px);
                 display: grid; grid-template-columns: repeat(2, 64px); gap: 10px; pointer-events: auto; }
  .touch button { height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,.25); background: rgba(18,18,17,.5); color: #f3eee6;
                  font: 600 10px/1 Inter, system-ui, sans-serif; letter-spacing: .18em; -webkit-tap-highlight-color: transparent; }
  .touch button.on { background: rgba(208,112,63,.92); }
  .touch .hint { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 90px); transform: translateX(-50%); color: rgba(243,238,230,.8);
                 font: 500 11px/1.3 Inter, system-ui, sans-serif; letter-spacing: .08em; text-shadow: 0 1px 6px rgba(0,0,0,.6); transition: opacity .6s; white-space: nowrap; }
  .touch .hint.gone { opacity: 0; }
  html:not(.full) .touch .btns { bottom: 70px; }
  /* Loading */
  #load { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0c0c; color: rgba(243,238,230,.7); z-index: 20;
          font: 500 11px/1 Inter, system-ui, sans-serif; letter-spacing: .3em; transition: opacity .8s; }
  #load.done { opacity: 0; pointer-events: none; }
  html, body { touch-action: none; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="load">LOADING THE CALDERA…</div>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="hud"></div>
</div>
<script>
  function fit() {
    const s = Math.min(innerWidth / 1350, innerHeight / 1080);
    document.getElementById('stage').style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  addEventListener('resize', fit); fit();
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
